<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2">
<title>Near me · Istanbul</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📍</text></svg>">
<meta name="description" content="Andrés's Istanbul picks around you: live map, swipeable cards, walking distances.">
<link rel="preconnect" href="https://places.googleapis.com">
<link rel="preconnect" href="https://lh3.googleusercontent.com">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<link rel="stylesheet" href="cards.css">
<style>
:root{--bg:#f6f5f2;--card:#fff;--fg:#1c1b19;--mut:#6f6b63;--line:#e6e2da;--acc:#1a73e8;--warn:#9b2318;--warnbg:#fdecea;--chip:#f1eee7;
--alt:#7b3fa0;--posh:#8a6500;--must:#b4532a;--trendy:#1f7a6c;--classic:#4a5a6a;--shadow:0 8px 28px rgba(0,0,0,.18)}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#map{position:fixed;inset:0}
.maplibregl-ctrl-attrib{font-size:10px}
/* top bar: just a way home */
.top{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:5;display:flex;gap:8px;align-items:center}
.top a{display:flex;align-items:center;gap:6px;height:38px;padding:0 14px 0 10px;border-radius:19px;background:var(--card);color:var(--fg);
text-decoration:none;font-weight:600;font-size:14px;box-shadow:var(--shadow)}
.top .n{font-weight:500;color:var(--mut)}
/* floating buttons, right side, thumb reach */
.fabs{position:fixed;right:12px;z-index:6;display:flex;flex-direction:column;gap:10px;bottom:calc(var(--sheet,330px) + 14px);transition:bottom .3s}
body.sheet-closed .fabs{bottom:calc(76px + env(safe-area-inset-bottom))}
.fab{width:42px;height:42px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);font-size:19px;display:grid;place-items:center;
cursor:pointer;position:relative;color:var(--fg)}
.fab.on{color:var(--acc)}.fab.dot::after{content:"";position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
.fab.busy::before{content:"";position:absolute;inset:-4px;border-radius:50%;border:3px solid var(--acc);animation:pulse 1s ease-out infinite}
@keyframes pulse{from{opacity:1;transform:scale(.85)}to{opacity:0;transform:scale(1.25)}}
.fab svg{width:22px;height:22px}
/* pins */
.pin{all:unset;box-sizing:border-box;cursor:pointer;width:30px;height:30px;border-radius:50%;background:#fff;border:2.5px solid var(--c);box-shadow:0 2px 6px rgba(0,0,0,.2);
display:grid;place-items:center;font-size:14px;line-height:1;position:relative;transition:scale .2s}
.mk{cursor:pointer}.mk.on{z-index:5}
.pin .pb{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);white-space:nowrap;background:#1c1b19;color:#fff;
font:600 12px/1 -apple-system,sans-serif;padding:7px 10px;border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.pin .pb::after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:#1c1b19}
.pin.on{scale:1.35}.pin.on .pb{display:block;transform:translateX(-50%) scale(.74);transform-origin:bottom center}
.pin-off{filter:grayscale(1);opacity:.55}
.me{width:18px;height:18px;border-radius:50%;background:var(--acc);border:3px solid #fff;box-shadow:0 0 0 8px rgba(26,115,232,.18),0 1px 4px rgba(0,0,0,.3)}
/* bottom sheet with horizontal, snapping cards */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:4;padding-bottom:calc(5px + env(safe-area-inset-bottom));transition:transform .3s ease}
body.sheet-closed #sheet{transform:translateY(110%)}
#cards{display:flex;align-items:flex-end;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 7vw 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
#cards::-webkit-scrollbar{display:none}
.cta{display:flex;gap:6px;margin-top:7px}.cta a,.cta button{flex:1;text-align:center;text-decoration:none;border:0;border-radius:9px;padding:6px 6px;font:600 13px/1.2 inherit;font-family:inherit;cursor:pointer}.cta .go{background:var(--fg);color:#fff;flex:1.3}.cta .gm,.cta .mb{background:var(--chip);color:var(--fg)}
#reopen{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translate(-50%,140%);z-index:4;border:0;background:var(--fg);color:#fff;
padding:12px 18px;border-radius:24px;font-weight:600;box-shadow:var(--shadow);transition:transform .3s;cursor:pointer}
body.sheet-closed #reopen{transform:translate(-50%,0)}
/* panels */
.panel{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:8;background:var(--card);border-radius:20px;box-shadow:var(--shadow);
max-height:72vh;overflow:auto;padding:14px 16px}
.panel[hidden]{display:none}
.panel h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.panel h3 button{border:0;background:var(--chip);border-radius:50%;width:30px;height:30px;cursor:pointer}
.fl{font-size:12px;color:var(--mut);margin:10px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.fr{display:flex;flex-wrap:wrap;gap:6px}
.fr button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer;opacity:.5}
.fr button.on{opacity:1;border-color:var(--c,var(--fg))}
.reset{margin-top:12px;border:0;background:none;color:var(--acc);font:inherit;cursor:pointer;padding:0}
#lbody{list-style:none;margin:0;padding:0}
#lbody button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;width:100%;padding:9px 0;border-bottom:1px solid var(--line)}
.le{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2.5px solid var(--c);box-shadow:0 2px 6px rgba(0,0,0,.15);flex:none}
.lt{display:flex;flex-direction:column}.lt small{color:var(--mut)}
#toast{position:fixed;top:calc(58px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-20px);opacity:0;z-index:9;background:var(--fg);color:#fff;
padding:9px 14px;border-radius:14px;font-size:13.5px;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:700px){.gc .card{flex-basis:380px}#cards{padding:0 calc(50vw - 190px) 4px}}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Map of recommended places"></div>
<nav class="top"><a href="index.html" aria-label="Back to the guide">← Istanbul <span class="n"><span id="count">0 places</span></span></a></nav>
<div class="fabs">
  <button class="fab" id="loc" type="button" aria-label="Update my location">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg></button>
  <button class="fab" id="fbtn" type="button" aria-label="Filters">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
  <button class="fab" id="lbtn" type="button" aria-label="List view">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
</div>
<section id="sheet" class="gc" aria-label="Places, nearest first"><div id="cards"></div></section>
<button id="reopen" type="button">Show places</button>
<section class="panel" id="filters" hidden aria-label="Filters">
  <h3>Filters <button type="button" data-close aria-label="Close">✕</button></h3>
  <div id="fwhobox"><div class="fl">Recommended by</div><div class="fr" id="fwho"></div></div>
  <div class="fl">Type</div><div class="fr" id="fcats"></div>
  <button class="reset" type="button" data-reset>Reset filters</button>
</section>
<section class="panel" id="list" hidden aria-label="List, nearest first">
  <h3>Nearest first <button type="button" data-close aria-label="Close">✕</button></h3>
  <ul id="lbody"></ul>
</section>
<div id="toast" role="status" aria-live="polite"></div>
<script>
// keep the floating buttons just above the card sheet, whatever its height on this phone
new ResizeObserver(function(){document.documentElement.style.setProperty('--sheet',document.getElementById('sheet').offsetHeight+'px')}).observe(document.getElementById('sheet'));
</script>
<script src="places-key.js?v=7a3ff9e5"></script>
<script src="cards.js"></script>
<script src="near.js?v=d1a9cd9c"></script>
</body>
</html>
